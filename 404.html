<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Redirect otomatis ke index.html dengan membawa parameter path aslinya
    const pathSegmentsToKeep = 1; // Sesuaikan kalau ada subpath (misal: /ngabret/ = 1)
    const l = window.location;
    let pathname = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
    let search = l.search;
    let hash = l.hash;
    l.replace(pathname + '/' + (pathname.endsWith('/') ? '' : '/') + '?p=/' + l.pathname.slice(pathname.length).replace(/^\//, '') + search + hash);
  </script>
</head>
<body>
</body>
</html>
